<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Button</title>



<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

nav{
    position:absolute;
    top:20px;
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:20px;
    padding:10px 18px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    transition:0.25s;
}

nav a:hover{
    background:#ff2ea6;
    transform:scale(1.05);
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:radial-gradient(circle at top,#222,#000);
}

.container{
    text-align:center;
    position:relative;
}

button{
    padding:22px 50px;
    font-size:30px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:#ff2ea6;
    color:white;
    font-weight:bold;
    transition:0.25s;
    box-shadow:0 0 25px #ff2ea6;
}

button:hover{
    transform:scale(1.08);
}

h1{
    margin-top:35px;
    font-size:65px;
    color:white;
    opacity:0;
    transform:scale(0.5);
    transition:0.6s ease;
    text-shadow:
        0 0 10px white,
        0 0 20px #ff00c8,
        0 0 40px #ff00c8;
}

h1.show{
    opacity:1;
    transform:scale(1);
}

.particle{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    pointer-events:none;
    animation:explode 1.4s ease-out forwards;
}

@keyframes explode{

    from{
        transform:translate(0,0) scale(1);
        opacity:1;
    }

    to{
        transform:translate(var(--x), var(--y)) scale(0);
        opacity:0;
    }
}

</style>
</head>

<body>

    <nav>
    <a href="index.html">Home</a>
    <a href="message.html">Message 💖</a>
    <a href="gallery.html">Gallery 📸</a>
</nav>

<div class="container">
    <button id="birthdayBtn">🎉 PRESS ME 🎉</button>
    <h1 id="message">HAPPY BIRTHDAYYYY MY BABY 🎂🔥</h1>
</div>

<!-- PUT YOUR SOUND FILE NAME HERE -->
<audio id="soundEffect" src="audio/freesound_community-fireworks-29629.mp3"></audio>

<script>

const btn = document.getElementById("birthdayBtn");
const message = document.getElementById("message");
const sound = document.getElementById("soundEffect");

btn.addEventListener("click", () => {

    // PLAY SOUND
    sound.currentTime = 0;
    sound.play();

    // SHOW TEXT
    message.classList.add("show");

    // FIREWORK PARTICLES
    for(let i = 0; i < 140; i++){

        const particle = document.createElement("div");
        particle.classList.add("particle");

        const colors = [
            "#ff0000",
            "#00ffea",
            "#ffff00",
            "#ff00ff",
            "#00aaff",
            "#ffffff",
            "#ff8800"
        ];

        particle.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        const x = (Math.random() - 0.5) * 1200 + "px";
        const y = (Math.random() - 0.5) * 1200 + "px";

        particle.style.setProperty("--x", x);
        particle.style.setProperty("--y", y);

        particle.style.left =
            window.innerWidth / 2 + "px";

        particle.style.top =
            window.innerHeight / 2 + "px";

        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 1400);
    }

});

</script>

</body>
</html>
